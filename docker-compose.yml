services:
  69-s2-db:
    image: postgres:15-alpine
    container_name: 69-s2-db
    environment:
      POSTGRES_USER: intouch
      POSTGRES_PASSWORD: ddfg42236590
      POSTGRES_DB: strapi
    ports:
      - "5432:5432"
    restart: always

  69-s2-admin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: temza2018@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - 69-s2-db
    restart: always

  69-s2-app:
    image: prawee/strapi
    container_name: 69-s2-app
    ports:
      - "9092:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: 69-s2-db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapiPassword
    depends_on:
      - 69-s2-db
    restart: always