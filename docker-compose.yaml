services:
  69-s1-db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54327:5432"
    environment: 
      - POSTGRES_PASSWORD=42236590
      - POSTGRES_USER=intouch
      - POSTGRES_DB=intouch
    volumes:
      - db_data:/var/lib/postgresql/data

  69-s1-admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - "8081:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=temza2018@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=ddfg42236590
    volumes :
      - ./data-pgadmin:/var/lib/pgadmin/data
    depends_on:
      - db

  app:
    image: prawee/strapi
    container_name: 69-s2-app
    ports:
      - "9092:1337"
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASS}
      - DATABASE_SSL=false
      - JWT_SECRET=${APP_JWT_SECRET}
      - ADMIN_JWT_SECRET=${APP_ADMIN_JWT_SECRET}
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${APP_API_TOKEN_SALT}
      - TRANSFER_TOKEN_SALT=${APP_TRANSFER_TOKEN_SALT}
    depends_on:
      - db
  
